<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chihiros README title</title>
<!--
  Template for a README title image (2560 x 1280) with the photo docs/images/stage-photo.jpg instead of a
  window frame. The README currently uses the finished image docs/images/readme-title.webp unchanged. Same layout as
  sh1ft-w.github.io/theme/v1/readme-images/title.html. Render light and dark with headless Chrome:
    chrome-headless-shell --screenshot=docs/images/readme-title-light.png --window-size=1280,640 \
      --force-device-scale-factor=2 --hide-scrollbars "file://$PWD/docs/readme-title.html"
    ... --screenshot=docs/images/readme-title-dark.png ... "file://$PWD/docs/readme-title.html?dark"
-->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
  :root {
    --bg: #FAF5F4; --bg-2: #F2E8E6; --ink: #1E1012; --ink-2: #5E4B4D; --accent-text: #B8000E; --accent: #E60012; --accent-2: #FF4D57;
    --glow-1: rgba(230,0,18,0.12); --glow-2: rgba(120,0,10,0.08); --pill-bg: #ffffff; --pill-line: rgba(50,5,10,0.08);
    --photo-filter: none;
  }
  :root.dark {
    --bg: #140809; --bg-2: #1D0D0F; --ink: #F7ECEC; --ink-2: rgba(240,220,222,0.84); --accent-text: #FF7A80; --accent: #FF4D57; --accent-2: #E60012;
    --glow-1: rgba(255,77,87,0.18); --glow-2: rgba(140,0,12,0.16); --pill-bg: rgba(255,255,255,0.06); --pill-line: rgba(255,255,255,0.10);
    --photo-filter: brightness(0.82) saturate(1.05);
  }
  * { box-sizing: border-box; margin: 0; }
  body { width: 1280px; height: 640px; overflow: hidden; font-family: "Inter", -apple-system, system-ui, sans-serif; color: var(--ink); position: relative;
    background: radial-gradient(900px 520px at 18% 30%, var(--glow-1), transparent 60%),
                radial-gradient(700px 500px at 86% 90%, var(--glow-2), transparent 60%),
                linear-gradient(135deg, var(--bg) 0%, var(--bg-2) 100%); }
  .photo { position: absolute; right: 0; top: 0; height: 640px; width: auto; filter: var(--photo-filter);
    -webkit-mask-image: linear-gradient(90deg, transparent 0%, rgba(0,0,0,0.55) 14%, #000 30%);
            mask-image: linear-gradient(90deg, transparent 0%, rgba(0,0,0,0.55) 14%, #000 30%); }
  :root.dark .photo { -webkit-mask-image: linear-gradient(90deg, transparent 0%, rgba(0,0,0,0.45) 22%, #000 44%); mask-image: linear-gradient(90deg, transparent 0%, rgba(0,0,0,0.45) 22%, #000 44%); }
  .left { position: absolute; left: 72px; top: 0; bottom: 0; width: 470px; display: flex; flex-direction: column; justify-content: center; }
  .brand { display: flex; align-items: center; gap: 18px; }
  .brand img { width: 74px; height: 74px; border-radius: 18px; box-shadow: 0 10px 30px rgba(0,0,0,0.22); }
  .brand h1 { font-family: "Archivo", -apple-system, system-ui, sans-serif; font-weight: 800; font-size: 68px; letter-spacing: -0.03em; line-height: 1; }
  .eyebrow { margin-top: 18px; font-family: "JetBrains Mono", ui-monospace, Menlo, monospace; font-weight: 500; font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent-text); }
  .lead { margin-top: 26px; font-family: "Archivo", -apple-system, system-ui, sans-serif; font-weight: 700; font-size: 38px; letter-spacing: -0.02em; line-height: 1.08; }
  .lead em { font-style: normal; color: var(--accent-text); }
  .sub { margin-top: 16px; font-size: 18px; line-height: 1.45; color: var(--ink-2); max-width: 440px; }
  .pills { margin-top: 28px; display: flex; flex-wrap: wrap; gap: 8px; }
  .pill { font-family: "JetBrains Mono", ui-monospace, Menlo, monospace; font-size: 12px; font-weight: 500; letter-spacing: 0.02em; padding: 7px 12px; border-radius: 999px;
    background: var(--pill-bg); border: 1px solid var(--pill-line); color: var(--ink-2); display: inline-flex; align-items: center; gap: 7px; }
  .pill i { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); display: inline-block; }
  .pill.v i { background: var(--accent-2); }
</style>
<script>if (location.search.indexOf('dark') >= 0) document.documentElement.classList.add('dark');</script>
</head>
<body>
  <img class="photo" src="images/stage-photo.jpg" alt="">
  <div class="left">
    <div class="brand"><img src="images/readme-icon.png" alt=""><h1>Chihiros</h1></div>
    <div class="eyebrow">For Home Assistant</div>
    <div class="lead">Your Chihiros lamps, <em>steady over Bluetooth.</em></div>
    <div class="sub">Chihiros LED lamps and the dosing pump in Home Assistant: every channel as a slider, daily schedules written to the lamp, dosing that is never repeated. No app, no cloud.</div>
    <div class="pills"><span class="pill"><i></i>Local Bluetooth</span><span class="pill v"><i></i>Platinum</span><span class="pill"><i></i>HACS</span></div>
  </div>
</body>
</html>
