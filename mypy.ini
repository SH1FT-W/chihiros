# Typprüfung: uvx mypy@2.3.1 --python-executable .venv/bin/python (HA kommt aus der Projekt-venv)
[mypy]
python_version = 3.14
files = custom_components/chihiros
# Platin der Integration Quality Scale: strict typing
strict = true
show_error_codes = true

# HA-Pakete exportieren Teile ihrer Schnittstelle ohne `as`
[mypy-homeassistant.*]
implicit_reexport = true
